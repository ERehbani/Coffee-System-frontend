<nav
  aria-label="Navegación principal"
  class="fixed inset-x-0 bottom-0 z-10 border-t border-border bg-surface pb-[env(safe-area-inset-bottom)]"
>
  <ul class="mx-auto grid max-w-md grid-cols-4 gap-2 px-4 py-2 md:max-w-2xl">
    @for (item of items; track item.path) {
      <li>
        <a
          [routerLink]="item.path"
          routerLinkActive
          #link="routerLinkActive"
          ariaCurrentWhenActive="page"
          class="flex flex-col items-center gap-1 rounded-xl px-2 py-2 text-xs font-semibold transition-colors focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary"
          [class.bg-primary]="link.isActive"
          [class.text-white]="link.isActive"
          [class.text-muted]="!link.isActive"
        >
          <app-icon [name]="item.icon" [size]="22" />
          <span>{{ item.label }}</span>
        </a>
      </li>
    }
  </ul>
</nav>
