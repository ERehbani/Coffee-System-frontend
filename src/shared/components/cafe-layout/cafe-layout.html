<header
  class="sticky top-0 z-20 flex h-14 items-center justify-between border-b border-border bg-surface px-4 lg:hidden"
>
  <span class="text-base font-semibold text-text">Coffee System</span>
  <button
    #menuButton
    type="button"
    aria-controls="cafe-sidebar"
    [attr.aria-expanded]="menuOpen()"
    [attr.aria-label]="menuOpen() ? 'Cerrar menú' : 'Abrir menú'"
    (click)="toggleMenu()"
    class="inline-flex size-10 items-center justify-center rounded-md text-text transition-colors hover:bg-bg focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary"
  >
    <app-icon [name]="menuOpen() ? 'x' : 'menu'" [size]="22" />
  </button>
</header>

@if (menuOpen()) {
  <div
    data-testid="cafe-backdrop"
    aria-hidden="true"
    class="fixed inset-0 z-30 bg-ink/40 lg:hidden"
    (click)="closeMenu()"
  ></div>
}

<aside
  id="cafe-sidebar"
  class="fixed inset-y-0 left-0 z-40 flex w-60 flex-col border-r border-border bg-surface transition-[translate,visibility] duration-200 motion-reduce:transition-none lg:visible lg:translate-x-0"
  [class.invisible]="!menuOpen()"
  [class.-translate-x-full]="!menuOpen()"
>
  <p
    data-testid="cafe-brand"
    class="flex h-14 shrink-0 items-center border-b border-border px-4 text-base font-semibold text-text"
  >
    Coffee System
  </p>

  <nav aria-label="Mi cafetería" class="flex-1 overflow-y-auto px-2 py-3">
    <ul class="flex flex-col gap-0.5">
      @for (item of items; track item.path) {
        <li>
          <a
            [routerLink]="['/cafe', item.path]"
            routerLinkActive
            ariaCurrentWhenActive="page"
            (click)="closeMenu()"
            class="sidebar-link"
          >
            <app-icon [name]="item.icon" [size]="18" />
            {{ item.label }}
          </a>
        </li>
      }
    </ul>
  </nav>

  <footer class="flex flex-col gap-1 border-t border-border p-3">
    <p
      data-testid="cafe-name"
      [attr.title]="cafeName()"
      class="truncate px-2.5 py-1 text-sm font-semibold text-text"
    >
      {{ cafeName() ?? 'Cafetería' }}
    </p>
    <a
      routerLink="/cafe/password"
      (click)="closeMenu()"
      class="sidebar-link text-muted hover:text-text"
    >
      Cambiar contraseña
    </a>
    <div class="flex items-center justify-between gap-2">
      <app-logout-button />
      <app-theme-toggle />
    </div>
  </footer>
</aside>

<div class="lg:pl-60">
  <router-outlet />
</div>
