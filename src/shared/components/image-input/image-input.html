<fieldset class="space-y-1.5">
  <legend class="form-label">{{ label() }}</legend>
  <label [for]="inputId()" class="block text-[11px] font-semibold text-muted">URL de la imagen</label>
  <input
    [id]="inputId()"
    type="url"
    [value]="value()"
    (input)="changeUrl($any($event.target).value)"
    placeholder="https://..."
    class="form-control"
  />
  <div
    role="group"
    [attr.aria-labelledby]="inputId() + '-drop'"
    (dragover)="dragOver($event)"
    (dragleave)="dragLeave($event)"
    (drop)="drop($event)"
    class="flex flex-wrap items-center gap-2 rounded-md border border-dashed p-2 transition"
    [class.border-border]="!dragging()"
    [class.border-primary]="dragging()"
    [class.bg-accent-light]="dragging()"
  >
    <p [id]="inputId() + '-drop'" class="text-xs font-semibold text-muted">
      {{ dragging() ? 'Soltá la imagen para subirla' : 'Arrastrá una imagen acá o' }}
    </p>
    <label
      class="btn-secondary h-8 border-primary px-3 text-xs text-primary hover:bg-accent-light has-focus-visible:outline-2 has-focus-visible:outline-offset-2 has-focus-visible:outline-primary"
    >
      Subir desde tu computadora
      <input type="file" accept="image/*" class="sr-only" (change)="pickFile($any($event.target))" />
    </label>
    @if (preview()) {
      <button type="button" (click)="remove()" class="btn-secondary h-8 px-3 text-xs text-muted hover:text-text">
        Quitar imagen
      </button>
    }
    <p aria-live="polite" class="text-xs text-muted">{{ notice() }}</p>
  </div>
  @if (error(); as err) {
    <p role="alert" class="form-error">{{ err }}</p>
  }
  @if (preview(); as src) {
    <img [src]="src" [alt]="previewAlt()" class="rounded-md border border-border object-cover" [class]="previewClass()" />
  }
</fieldset>
