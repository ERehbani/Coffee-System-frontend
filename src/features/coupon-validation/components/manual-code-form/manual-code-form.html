<form (submit)="onSubmit($event)" novalidate>
  <h2 class="text-sm font-bold text-text">Escribir el código</h2>
  <p class="mb-3 text-xs text-muted">
    Usalo si la cámara no lee el QR. El código aparece debajo del QR en la app del cliente.
  </p>

  <label for="validation-code" class="form-label">Código del cupón</label>
  <div class="flex flex-col gap-2 sm:flex-row">
    <input
      id="validation-code"
      type="text"
      autocomplete="off"
      autocapitalize="off"
      spellcheck="false"
      [value]="code()"
      (input)="code.set($any($event.target).value)"
      [disabled]="disabled()"
      placeholder="Ej: 3f2b8c1e-9d4a-4c7b-8e21-5a6f0d9b7c34"
      class="form-control min-w-0 font-mono placeholder:font-sans"
    />
    <button type="submit" [disabled]="!canSubmit()" class="btn-primary shrink-0">
      {{ submitLabel() }}
    </button>
  </div>
</form>
