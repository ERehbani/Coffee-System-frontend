<form
  (submit)="onSubmit($event)"
  novalidate
  class="rounded-3xl border border-border bg-surface p-5 shadow-xs"
>
  <h2 class="text-base font-extrabold text-text">Escribir el código</h2>
  <p class="mb-4 text-xs text-muted">
    Usalo si la cámara no lee el QR. El código aparece debajo del QR en la app del cliente.
  </p>

  <label for="validation-code" class="mb-1.5 block text-sm font-bold text-text">
    Código del cupón
  </label>
  <div class="flex flex-col gap-3 sm:flex-row">
    <input
      id="validation-code"
      type="text"
      autocomplete="off"
      autocapitalize="off"
      spellcheck="false"
      [value]="code()"
      (input)="code.set($any($event.target).value)"
      [disabled]="disabled()"
      placeholder="Ej: 3f2b8c1e-9d4a-4c7b-8e21-5a6f0d9b7c34"
      class="w-full min-w-0 rounded-xl border border-border bg-bg px-4 py-2.5 font-mono text-sm text-text placeholder:font-sans placeholder:text-muted/60 transition focus:border-primary focus:bg-surface focus:outline-hidden focus:ring-2 focus:ring-primary/20 disabled:cursor-not-allowed disabled:opacity-60"
    />
    <button
      type="submit"
      [disabled]="!canSubmit()"
      class="cursor-pointer inline-flex shrink-0 items-center justify-center gap-2 rounded-xl bg-primary px-5 py-2.5 text-sm font-bold text-white shadow-sm transition-all duration-150 hover:bg-primary-dark hover:shadow-md active:scale-95 select-none focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary disabled:pointer-events-none disabled:opacity-50"
    >
      <app-icon name="check" [size]="18" />
      Validar código
    </button>
  </div>
</form>
