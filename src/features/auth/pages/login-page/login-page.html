<app-auth-shell heading="Iniciar sesión" linkLabel="Crear cuenta" [linkPath]="registerPath" [panel]="panel">
  @if (notice) {
    <div role="status" class="notice" [class.notice-success]="notice.isSuccess" [class.notice-warning]="!notice.isSuccess">
      <span class="flex items-center gap-2">
        <app-icon [name]="notice.isSuccess ? 'check-circle' : 'clock'" [size]="16" />
        <span>{{ notice.message }}</span>
      </span>
    </div>
  }

  @if (errorMessage()) {
    <div role="alert" class="notice notice-error">
      <span class="flex items-center gap-2">
        <app-icon name="alert-circle" [size]="16" />
        <span>{{ errorMessage() }}</span>
      </span>
    </div>
  }

  <form (submit)="onSubmit($event)" novalidate class="space-y-4">
    <div>
      <label for="login-email" class="form-label">Correo electrónico</label>
      <input
        id="login-email"
        type="email"
        autocomplete="username"
        [formField]="loginForm.email"
        placeholder="tu@correo.com"
        class="form-control"
        [attr.aria-invalid]="attemptedSubmit() && emailError() ? 'true' : null"
      />
      @if (attemptedSubmit() && emailError()) {
        <p role="alert" class="form-error">{{ emailError() }}</p>
      }
    </div>

    <div>
      <label for="login-password" class="form-label">Contraseña</label>
      <div class="relative">
        <input
          id="login-password"
          [type]="showPassword() ? 'text' : 'password'"
          autocomplete="current-password"
          [formField]="loginForm.password"
          class="form-control pr-10"
          [attr.aria-invalid]="attemptedSubmit() && passwordError() ? 'true' : null"
        />
        <button
          type="button"
          (click)="toggleShowPassword()"
          class="absolute inset-y-0 right-0 flex cursor-pointer items-center rounded-r-md pr-3 pl-2 text-muted hover:text-text focus-visible:outline-2 focus-visible:-outline-offset-2 focus-visible:outline-primary"
          [attr.aria-label]="showPassword() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
        >
          <app-icon [name]="showPassword() ? 'eye' : 'lock'" [size]="16" />
        </button>
      </div>
      @if (attemptedSubmit() && passwordError()) {
        <p role="alert" class="form-error">{{ passwordError() }}</p>
      }
    </div>

    <button type="submit" [disabled]="isSubmitting()" class="btn-primary w-full">
      {{ isSubmitting() ? 'Iniciando sesión...' : 'Iniciar sesión' }}
    </button>
  </form>
</app-auth-shell>
