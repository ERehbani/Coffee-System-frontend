<app-auth-shell heading="Iniciar sesión" linkLabel="Crear cuenta" [linkPath]="registerPath" [panel]="panel">
  @if (notice) {
    <div
      role="status"
      class="flex items-center gap-2 rounded-2xl border px-4 py-3 text-xs font-bold"
      [class.border-emerald-200]="notice.isSuccess"
      [class.bg-emerald-50]="notice.isSuccess"
      [class.text-emerald-800]="notice.isSuccess"
      [class.border-amber-200]="!notice.isSuccess"
      [class.bg-amber-50]="!notice.isSuccess"
      [class.text-amber-800]="!notice.isSuccess"
    >
      <app-icon [name]="notice.isSuccess ? 'check-circle' : 'clock'" [size]="16" />
      <span>{{ notice.message }}</span>
    </div>
  }

  @if (errorMessage()) {
    <div
      role="alert"
      class="flex items-center gap-2 rounded-2xl border border-rose-200 bg-rose-50 px-4 py-3 text-xs font-bold text-rose-800"
    >
      <app-icon name="alert-circle" [size]="16" class="text-rose-600" />
      <span>{{ errorMessage() }}</span>
    </div>
  }

  <form (submit)="onSubmit($event)" novalidate class="space-y-5">
    <div class="space-y-1.5">
      <label for="login-email" class="block text-sm font-semibold text-text">Correo electrónico</label>
      <input
        id="login-email"
        type="email"
        autocomplete="username"
        [formField]="loginForm.email"
        placeholder="tu@correo.com"
        class="w-full rounded-2xl border border-border bg-surface px-5 py-3.5 text-base text-text placeholder:text-muted/60 transition focus:border-primary focus:outline-hidden focus:ring-2 focus:ring-primary/30"
        [class.border-rose-400]="attemptedSubmit() && emailError()"
      />
      @if (attemptedSubmit() && emailError()) {
        <p role="alert" class="text-xs font-semibold text-rose-600">{{ emailError() }}</p>
      }
    </div>

    <div class="space-y-1.5">
      <label for="login-password" class="block text-sm font-semibold text-text">Contraseña</label>
      <div class="relative">
        <input
          id="login-password"
          [type]="showPassword() ? 'text' : 'password'"
          autocomplete="current-password"
          [formField]="loginForm.password"
          class="w-full rounded-2xl border border-border bg-surface py-3.5 pr-12 pl-5 text-base text-text transition focus:border-primary focus:outline-hidden focus:ring-2 focus:ring-primary/30"
          [class.border-rose-400]="attemptedSubmit() && passwordError()"
        />
        <button
          type="button"
          (click)="toggleShowPassword()"
          class="absolute inset-y-0 right-0 flex cursor-pointer items-center rounded-r-2xl pr-4 pl-2 text-muted hover:text-text focus-visible:outline-2 focus-visible:-outline-offset-2 focus-visible:outline-primary"
          [attr.aria-label]="showPassword() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
        >
          <app-icon [name]="showPassword() ? 'eye' : 'lock'" [size]="18" />
        </button>
      </div>
      @if (attemptedSubmit() && passwordError()) {
        <p role="alert" class="text-xs font-semibold text-rose-600">{{ passwordError() }}</p>
      }
    </div>

    <button
      type="submit"
      [disabled]="isSubmitting()"
      class="w-full cursor-pointer rounded-2xl bg-primary px-4 py-3.5 text-base font-bold text-white transition hover:bg-primary-dark focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary active:scale-[0.98] disabled:cursor-not-allowed disabled:opacity-60"
    >
      {{ isSubmitting() ? 'Iniciando sesión...' : 'Iniciar sesión' }}
    </button>
  </form>
</app-auth-shell>
