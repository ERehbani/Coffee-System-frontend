<button
  type="button"
  (click)="logout()"
  [disabled]="isLoggingOut()"
  class="cursor-pointer inline-flex items-center gap-1.5 rounded-xl border border-border bg-surface px-3 py-1.5 text-xs font-bold text-muted transition-all hover:bg-bg hover:text-text active:scale-95 select-none disabled:cursor-not-allowed disabled:opacity-60 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary"
>
  <app-icon name="log-out" [size]="14" />
  {{ isLoggingOut() ? 'Cerrando sesión...' : 'Cerrar sesión' }}
</button>
