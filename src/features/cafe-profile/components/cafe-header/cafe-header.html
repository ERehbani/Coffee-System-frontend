<header>
  <div class="relative">
    <div class="h-40 w-full overflow-hidden rounded-md border border-border bg-accent-light md:h-52">
      @if (cover()) {
        <img [src]="cover()" [alt]="'Portada de ' + profile().name" class="size-full object-cover" />
      } @else {
        <div class="flex size-full items-center justify-center text-accent">
          <app-icon name="store" [size]="48" />
        </div>
      }
    </div>

    <div class="absolute -bottom-10 left-4 md:left-6">
      <div class="size-20 overflow-hidden rounded-full border-4 border-bg bg-accent-light md:size-24">
        @if (logo()) {
          <img [src]="logo()" [alt]="'Logo de ' + profile().name" class="size-full object-cover" />
        } @else {
          <span class="flex size-full items-center justify-center text-primary">
            <app-icon name="coffee" [size]="32" />
          </span>
        }
      </div>
      <span
        class="absolute right-1 bottom-1 size-4 rounded-full border-2 border-bg"
        [class.bg-success]="profile().isOpen"
        [class.bg-muted]="!profile().isOpen"
        aria-hidden="true"
      ></span>
    </div>
  </div>

  <div class="flex min-h-10 items-center justify-end pt-3">
    @if (!isEditing()) {
      <button type="button" (click)="editClicked.emit()" class="btn-primary">
        <app-icon name="edit" [size]="14" />
        Editar perfil
      </button>
    }
  </div>

  <div class="mt-1 px-1">
    <h2 class="text-2xl font-bold text-text">{{ profile().name }}</h2>
    <p class="text-sm font-medium text-muted">{{ profile().email }}</p>
  </div>
</header>
