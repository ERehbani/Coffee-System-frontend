<header class="relative overflow-hidden rounded-3xl border border-border bg-surface shadow-sm">
  <div class="relative h-48 w-full overflow-hidden bg-accent-light md:h-64">
    @if (profile().image) {
      <img
        [src]="profile().image"
        [alt]="profile().name"
        class="h-full w-full object-cover"
      />
    } @else {
      <div class="flex h-full w-full items-center justify-center text-accent">
        <app-icon name="store" [size]="56" />
      </div>
    }
    <div class="absolute inset-0 bg-gradient-to-t from-black/60 via-transparent to-transparent"></div>
    <div class="absolute top-4 right-4">
      @if (profile().isOpen) {
        <span class="inline-flex items-center gap-1.5 rounded-full bg-success/90 px-3.5 py-1 text-xs font-bold tracking-wide text-white backdrop-blur-sm">
          <span class="size-2 rounded-full bg-white animate-pulse"></span>
          Abierto al público
        </span>
      } @else {
        <span class="inline-flex items-center gap-1.5 rounded-full bg-muted/90 px-3.5 py-1 text-xs font-bold tracking-wide text-white backdrop-blur-sm">
          <span class="size-2 rounded-full bg-white/60"></span>
          Cerrado
        </span>
      }
    </div>
  </div>

  <div class="p-6 md:p-8">
    <div class="flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between">
      <div class="space-y-1">
        <div class="flex items-center gap-2">
          <span class="inline-flex size-10 items-center justify-center rounded-xl bg-accent-light text-primary">
            <app-icon name="coffee" [size]="22" />
          </span>
          <h1 class="text-2xl font-extrabold tracking-tight text-text md:text-3xl">
            {{ profile().name }}
          </h1>
        </div>
        <p class="text-sm font-medium text-muted">
          {{ profile().email }}
        </p>
      </div>

      @if (!isEditing()) {
        <button
          type="button"
          (click)="editClicked.emit()"
          class="cursor-pointer inline-flex items-center justify-center gap-2 rounded-xl bg-primary px-5 py-2.5 text-sm font-bold text-white shadow-sm transition-all duration-150 hover:bg-primary-dark hover:shadow-md active:scale-95 select-none focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary"
        >
          <app-icon name="edit" [size]="18" />
          Editar perfil
        </button>
      }
    </div>
  </div>
</header>
