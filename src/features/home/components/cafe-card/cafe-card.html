<article
  role="button"
  tabindex="0"
  (click)="onCardClick()"
  (keydown.enter)="onCardClick()"
  (keydown.space)="onCardClick()"
  class="group relative flex cursor-pointer gap-4 rounded-2xl border bg-surface p-3.5 shadow-xs transition-all duration-200 hover:shadow-md focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary"
  [class.border-primary]="isSelected()"
  [class.ring-2]="isSelected()"
  [class.ring-primary]="isSelected()"
  [class.bg-accent-light/20]="isSelected()"
  [class.border-border]="!isSelected()"
>
  <div class="relative size-24 shrink-0 overflow-hidden rounded-xl bg-border">
    <img
      [src]="cafe().image || 'https://images.unsplash.com/photo-1525610553991-2bede1a236e2?w=600&h=400&fit=crop&q=80&auto=format'"
      [alt]="cafe().name"
      class="size-full object-cover transition-transform duration-300 group-hover:scale-105"
      loading="lazy"
    />
    @if (cafe().state) {
      <span class="absolute top-1.5 left-1.5 rounded-full bg-success/90 px-2 py-0.5 text-[10px] font-semibold text-white backdrop-blur-xs">
        Abierto
      </span>
    } @else {
      <span class="absolute top-1.5 left-1.5 rounded-full bg-text/70 px-2 py-0.5 text-[10px] font-semibold text-white backdrop-blur-xs">
        Cerrado
      </span>
    }
  </div>

  <div class="min-w-0 flex-1 flex flex-col justify-between py-0.5">
    <div>
      <div class="flex items-start justify-between gap-2">
        <h3 class="text-base font-bold text-text group-hover:text-primary transition-colors line-clamp-1">
          {{ cafe().name }}
        </h3>
        @if (isSelected()) {
          <span class="shrink-0 rounded-full bg-primary px-2.5 py-0.5 text-xs font-semibold text-white flex items-center gap-1">
            <app-icon name="check" [size]="12" />
            Elegida
          </span>
        }
      </div>

      <p class="mt-1 flex items-center gap-1 text-xs text-muted line-clamp-1">
        <app-icon name="map-pin" [size]="13" class="shrink-0 text-accent" />
        <span>{{ cafe().address }}</span>
      </p>

      @if (cafe().description) {
        <p class="mt-1.5 text-xs text-muted line-clamp-2 leading-relaxed">
          {{ cafe().description }}
        </p>
      }
    </div>

    <div class="mt-2.5 flex items-center justify-between border-t border-border/60 pt-2 text-xs">
      <div class="flex items-center gap-1.5">
        <app-icon name="star" [size]="13" class="text-gold" />
        <span class="font-bold text-text">{{ cafe().rating || 4.8 }}</span>
        <span class="text-muted">({{ cafe().reviewCount || 100 }})</span>
      </div>

      @if (cafe().schedule) {
        <span class="text-muted flex items-center gap-1">
          <app-icon name="clock" [size]="12" />
          {{ cafe().schedule }}
        </span>
      }
    </div>
  </div>
</article>
