<article
  class="group relative flex gap-3.5 rounded-2xl border border-border bg-surface p-3.5 shadow-xs transition-all duration-200 hover:border-primary/40 hover:shadow-md"
>
  <div class="relative size-20 shrink-0 overflow-hidden rounded-xl bg-border">
    <img
      [src]="product().image || 'https://images.unsplash.com/photo-1510707577719-ae7c14805e3a?w=400&h=300&fit=crop&q=80&auto=format'"
      [alt]="product().name"
      class="size-full object-cover transition-transform duration-300 group-hover:scale-105"
      loading="lazy"
    />
    @if (product().awardedPoints; as pts) {
      <span
        class="absolute bottom-1 left-1 flex items-center gap-0.5 rounded-full bg-primary/90 px-1.5 py-0.5 text-[10px] font-semibold text-white backdrop-blur-xs"
      >
        <app-icon name="zap" [size]="10" />
        +{{ pts }}
      </span>
    }
  </div>

  <div class="flex min-w-0 flex-1 flex-col justify-between py-0.5">
    <div>
      <div class="flex items-start justify-between gap-1.5">
        <h4 class="text-sm font-bold text-text transition-colors group-hover:text-primary line-clamp-1">
          {{ product().name }}
        </h4>
        <span class="shrink-0 rounded-full bg-accent-light/60 px-2 py-0.5 text-[10px] font-semibold text-primary-dark">
          {{ product().category }}
        </span>
      </div>

      @if (product().description) {
        <p class="mt-1 text-xs text-muted line-clamp-2 leading-relaxed">
          {{ product().description }}
        </p>
      }
    </div>

    <div class="mt-2.5 flex items-center justify-between border-t border-border/60 pt-2">
      <span class="text-sm font-bold text-text">
        {{ product().price | currency:'ARS':'$ ':'1.0-0' }}
      </span>

      <button
        type="button"
        (click)="onAddClick()"
        [attr.aria-label]="'Agregar ' + product().name + ' al pedido'"
        class="flex items-center gap-1 rounded-xl bg-accent-light px-2.5 py-1 text-xs font-semibold text-primary-dark transition-all hover:bg-primary hover:text-white focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary active:scale-95 cursor-pointer"
      >
        <app-icon name="plus" [size]="13" />
        <span>Agregar</span>
      </button>
    </div>
  </div>
</article>
