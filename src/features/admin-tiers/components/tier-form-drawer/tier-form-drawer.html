<div
  data-testid="tier-drawer-backdrop"
  aria-hidden="true"
  class="fixed inset-0 z-40 bg-ink/40"
  (click)="onCancel()"
></div>

<div
  #panel
  role="dialog"
  aria-modal="true"
  aria-labelledby="tier-drawer-title"
  class="fixed inset-y-0 right-0 z-50 flex w-full max-w-md flex-col border-l border-border bg-surface"
  (keydown)="onKeydown($event)"
>
  <form (submit)="onSubmit($event)" novalidate class="flex min-h-0 flex-1 flex-col">
    <header class="modal-header items-center">
      <h2 id="tier-drawer-title" class="modal-title">{{ title() }}</h2>
      <button
        type="button"
        aria-label="Cerrar"
        title="Cerrar"
        [disabled]="isProcessing()"
        (click)="onCancel()"
        class="icon-btn"
      >
        <app-icon name="x" [size]="14" />
      </button>
    </header>

    <div class="modal-body space-y-4">
      @if (errors().form; as formError) {
        <div role="alert" class="notice notice-error">
          <p>{{ formError }}</p>
        </div>
      }

      <div>
        <p class="form-section-title">Datos del nivel</p>
        <div class="form-grid">
          <div>
            <label for="tier-name" class="form-label">Nombre</label>
            <input
              #nameInput
              id="tier-name"
              name="name"
              type="text"
              autocomplete="off"
              [ngModel]="name()"
              (ngModelChange)="onNameChange($event)"
              [attr.aria-invalid]="nameError() ? 'true' : null"
              [attr.aria-describedby]="nameError() ? 'tier-name-error' : null"
              [class.border-rose-600]="nameError()"
              class="form-control"
            />
            @if (nameError(); as message) {
              <p id="tier-name-error" class="form-error">{{ message }}</p>
            }
          </div>

          <div>
            <label for="tier-min-points" class="form-label">Puntos necesarios</label>
            <input
              id="tier-min-points"
              name="minPoints"
              type="number"
              min="0"
              step="1"
              inputmode="numeric"
              [disabled]="isBaseTier()"
              [ngModel]="minPoints()"
              (ngModelChange)="onPointsChange($event)"
              [attr.aria-invalid]="pointsError() ? 'true' : null"
              [attr.aria-describedby]="
                pointsError() ? 'tier-min-points-error' : isBaseTier() ? 'tier-min-points-hint' : null
              "
              [class.border-rose-600]="pointsError()"
              class="form-control"
            />
            @if (pointsError(); as message) {
              <p id="tier-min-points-error" class="form-error">{{ message }}</p>
            } @else if (isBaseTier()) {
              <p id="tier-min-points-hint" class="mt-1 text-[11px] text-muted">
                El tier base siempre requiere 0 puntos.
              </p>
            }
          </div>
        </div>
      </div>
    </div>

    <footer class="modal-footer">
      <button type="button" [disabled]="isProcessing()" (click)="onCancel()" class="btn-secondary">
        Cancelar
      </button>
      <button type="submit" [disabled]="isProcessing()" class="btn-primary">Guardar</button>
    </footer>
  </form>
</div>
