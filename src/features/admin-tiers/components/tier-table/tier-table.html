<div class="overflow-x-auto rounded-2xl border border-border bg-surface">
  <table class="w-full text-left text-sm">
    <caption class="sr-only">
      Tiers y puntos necesarios para alcanzarlos
    </caption>
    <thead class="border-b border-border bg-bg text-xs font-semibold text-muted">
      <tr>
        <th scope="col" class="px-4 py-3">Nombre</th>
        <th scope="col" class="px-4 py-3">Puntos necesarios</th>
        <th scope="col" class="px-4 py-3 text-right">Acciones</th>
      </tr>
    </thead>
    <tbody class="divide-y divide-border">
      @for (tier of tiers(); track tier.id) {
        <tr>
          <td class="px-4 py-3 font-semibold text-text">
            <span class="inline-flex items-center gap-2">
              {{ tier.name }}
              @if (tier.id === baseTierId()) {
                <span
                  class="rounded-full bg-accent-light px-2 py-0.5 text-xs font-semibold text-primary-dark"
                >
                  Base
                </span>
              }
            </span>
          </td>
          <td class="px-4 py-3 text-text tabular-nums">{{ formatPoints(tier.minPoints) }}</td>
          <td class="px-4 py-3 text-right">
            <button
              type="button"
              [attr.aria-label]="'Editar ' + tier.name"
              (click)="edit.emit(tier)"
              class="inline-flex size-9 cursor-pointer items-center justify-center rounded-lg text-muted transition-colors hover:bg-accent-light hover:text-primary focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary"
            >
              <app-icon name="edit" [size]="18" />
            </button>
          </td>
        </tr>
      }
    </tbody>
  </table>
</div>
