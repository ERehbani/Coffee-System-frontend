<div class="data-table-wrap">
  <table class="data-table">
    <caption class="sr-only">
      Tiers y puntos necesarios para alcanzarlos
    </caption>
    <thead>
      <tr>
        <th scope="col">Nombre</th>
        <th scope="col">Puntos necesarios</th>
        <th scope="col" class="data-table-actions">Acciones</th>
      </tr>
    </thead>
    <tbody>
      @for (tier of tiers(); track tier.id) {
        <tr>
          <td class="font-bold text-text">
            <span class="inline-flex items-center gap-2">
              {{ tier.name }}
              @if (tier.id === baseTierId()) {
                <span class="badge bg-accent-light text-primary-dark">Base</span>
              }
            </span>
          </td>
          <td class="text-text tabular-nums">{{ formatPoints(tier.minPoints) }}</td>
          <td class="data-table-actions">
            <div class="row-actions">
              <button
                type="button"
                [attr.aria-label]="'Editar ' + tier.name"
                title="Editar"
                (click)="edit.emit(tier)"
                class="icon-btn icon-btn-primary"
              >
                <app-icon name="edit" [size]="14" />
              </button>
            </div>
          </td>
        </tr>
      }
    </tbody>
  </table>
</div>
