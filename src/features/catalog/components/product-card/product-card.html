<article
  class="group relative flex h-full flex-col justify-between overflow-hidden rounded-2xl border border-border bg-surface p-2.5 shadow-xs transition-all duration-300 hover:-translate-y-0.5 hover:border-primary/50 hover:shadow-md sm:p-4"
>
  <button
    type="button"
    (click)="onViewClick()"
    [attr.aria-label]="'Ver detalle de ' + product().name"
    class="block w-full text-left cursor-pointer focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary rounded-xl"
  >
    <div class="relative aspect-[4/3] w-full overflow-hidden rounded-xl bg-border/50 sm:aspect-auto sm:h-36">
      <img
        [src]="product().image || 'https://images.unsplash.com/photo-1510707577719-ae7c14805e3a?w=500&h=350&fit=crop&q=80&auto=format'"
        [alt]="product().name"
        class="size-full object-cover transition-transform duration-500 group-hover:scale-105"
        loading="lazy"
      />
    </div>

    <h4 class="mt-2 line-clamp-2 text-sm font-bold text-text transition-colors group-hover:text-primary leading-tight sm:mt-3.5 sm:text-base">
      {{ product().name }}
    </h4>
    <span class="mt-0.5 inline-block text-[11px] font-medium text-primary group-hover:underline sm:mt-1 sm:text-xs">
      Ver detalle
    </span>
  </button>

  <div class="mt-2 flex items-center justify-between gap-2 border-t border-border/60 pt-2 sm:mt-4 sm:pt-3">
    <span class="text-sm font-extrabold text-text sm:text-base">
      {{ product().price | currency:'ARS':'$ ':'1.0-0' }}
    </span>

    <button
      type="button"
      (click)="onAddClick()"
      [attr.aria-label]="'Agregar ' + product().name + ' al carrito'"
      class="inline-flex shrink-0 items-center gap-1.5 rounded-xl bg-primary p-2 text-xs font-semibold text-white shadow-xs transition-all hover:bg-primary-dark hover:shadow-sm focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary active:scale-95 cursor-pointer sm:px-3.5"
    >
      <app-icon name="plus" [size]="14" />
      <span class="hidden sm:inline">Agregar</span>
    </button>
  </div>
</article>
