<article
  class="group relative flex h-full flex-col justify-between overflow-hidden rounded-2xl border border-border bg-surface p-4 shadow-xs transition-all duration-300 hover:-translate-y-0.5 hover:border-primary/50 hover:shadow-md"
>
  <div>
    <!-- Image & points -->
    <div class="relative h-36 w-full overflow-hidden rounded-xl bg-border/50">
      <img
        [src]="product().image || 'https://images.unsplash.com/photo-1510707577719-ae7c14805e3a?w=500&h=350&fit=crop&q=80&auto=format'"
        [alt]="product().name"
        class="size-full object-cover transition-transform duration-500 group-hover:scale-105"
        loading="lazy"
      />
      @if (product().awardedPoints; as pts) {
        <span
          class="absolute bottom-2 left-2 inline-flex items-center gap-1 rounded-full bg-primary/95 px-2 py-0.5 text-[11px] font-semibold text-white shadow-sm backdrop-blur-md"
        >
          <app-icon name="zap" [size]="11" />
          +{{ pts }} pts
        </span>
      }
    </div>

    <!-- Title and Category -->
    <div class="mt-3.5 space-y-1.5">
      <div class="flex items-start justify-between gap-2">
        <h4 class="text-base font-bold text-text transition-colors group-hover:text-primary leading-tight">
          {{ product().name }}
        </h4>
        <span class="shrink-0 rounded-full bg-accent-light px-2.5 py-0.5 text-[11px] font-semibold text-primary-dark">
          {{ product().category }}
        </span>
      </div>

      @if (product().description) {
        <p class="text-xs text-muted leading-relaxed line-clamp-2">
          {{ product().description }}
        </p>
      }
    </div>
  </div>

  <!-- Price & Action -->
  <div class="mt-4 flex items-center justify-between border-t border-border/60 pt-3">
    <div class="flex flex-col">
      <span class="text-[10px] uppercase font-bold tracking-wider text-muted">Precio</span>
      <span class="text-base font-extrabold text-text">
        {{ product().price | currency:'ARS':'$ ':'1.0-0' }}
      </span>
    </div>

    <button
      type="button"
      (click)="onAddClick()"
      [attr.aria-label]="'Agregar ' + product().name + ' al pedido'"
      class="inline-flex items-center gap-1.5 rounded-xl bg-primary px-3.5 py-2 text-xs font-semibold text-white shadow-xs transition-all hover:bg-primary-dark hover:shadow-sm focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary active:scale-95 cursor-pointer"
    >
      <app-icon name="plus" [size]="14" />
      <span>Agregar</span>
    </button>
  </div>
</article>
