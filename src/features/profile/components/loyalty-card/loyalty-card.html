<section
  aria-label="Tarjeta R&amp;R Club"
  class="rounded-3xl bg-linear-to-br from-primary-dark to-text p-5 text-white shadow-xl shadow-primary-dark/25 sm:p-6"
>
  <div class="flex items-start justify-between gap-3">
    <p
      class="inline-flex items-center gap-1.5 rounded-full border border-white/20 bg-white/10 px-3 py-1 text-xs font-bold tracking-wide uppercase"
    >
      <span class="inline-flex" [class]="tierClass()">
        <app-icon name="shield" [size]="14" [filled]="true" />
      </span>
      Nivel {{ tierLabel() }}
    </p>
    <p class="pt-1 text-xs font-bold tracking-[0.2em] text-white/70">R&amp;R CLUB</p>
  </div>

  <p class="mt-6 flex items-baseline gap-2">
    <span class="text-5xl font-extrabold tracking-tight">{{
      loyalty().availablePoints | number
    }}</span>
    &ngsp;
    <span class="text-lg font-semibold text-white/90">pts disponibles</span>
  </p>
  <p class="mt-1 flex items-center gap-1.5 text-sm text-white/70">
    <app-icon name="history" [size]="14" />
    {{ loyalty().lifetimePoints | number }} pts acumulados en total
  </p>

  <a
    routerLink="/profile/tier"
    class="group mt-5 block rounded-2xl bg-text/50 p-4 transition-colors hover:bg-text/70 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-white"
  >
    <app-tier-progress
      [progress]="progress()"
      [lifetimePoints]="loyalty().lifetimePoints"
      [nextTier]="loyalty().nextTier"
      [nextTierThreshold]="loyalty().nextTierThreshold"
    />
    <span
      class="mt-3 flex items-center justify-end gap-1 text-xs font-bold text-white/80 group-hover:text-white"
    >
      Ver detalle de mi nivel
      <app-icon name="chevron-right" [size]="14" />
    </span>
  </a>

  <div class="mt-5 grid grid-cols-2 gap-3">
    <button
      type="button"
      (click)="scanQr.emit()"
      class="flex items-center justify-center gap-2 rounded-xl bg-white px-3 py-3 text-sm font-bold text-primary-dark transition-colors hover:bg-accent-light focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-white"
    >
      <app-icon name="scan-qr-code" [size]="18" />
      Escanear QR
    </button>
    <button
      type="button"
      (click)="viewCard.emit()"
      class="flex items-center justify-center gap-2 rounded-xl border border-white/30 px-3 py-3 text-sm font-bold text-white transition-colors hover:bg-white/10 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-white"
    >
      <app-icon name="id-card" [size]="18" />
      Ver mi carnet
    </button>
  </div>
</section>
