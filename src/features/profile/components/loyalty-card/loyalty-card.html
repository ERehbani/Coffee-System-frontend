<section
  aria-label="Tarjeta R&amp;R Club"
  class="rounded-3xl bg-linear-to-br from-primary-dark to-ink p-5 text-white sm:p-6"
>
  <div class="flex items-start justify-between gap-3">
    <p
      class="rounded-full border border-white/20 bg-white/10 px-3 py-1 text-xs font-bold tracking-wide uppercase"
    >
      Nivel {{ tierLabel() }}
    </p>
    <p class="pt-1 text-xs font-bold tracking-[0.2em] text-white/70">R&amp;R CLUB</p>
  </div>

  <p class="mt-6 flex items-baseline gap-2">
    <span class="text-5xl font-extrabold tracking-tight">{{
      loyalty().availablePoints | number
    }}</span>
    &ngsp;
    <span class="text-lg font-semibold text-white/90">pts disponibles</span>
  </p>
  <p class="mt-1 text-sm text-white/70">
    {{ loyalty().lifetimePoints | number }} pts acumulados en total
  </p>

  <a
    routerLink="/profile/tier"
    class="group mt-5 block rounded-2xl bg-ink/50 p-4 transition-colors hover:bg-ink/70 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-white"
  >
    <app-tier-progress
      [progress]="progress()"
      [lifetimePoints]="loyalty().lifetimePoints"
      [nextTier]="loyalty().nextTier"
      [nextTierThreshold]="loyalty().nextTierThreshold"
    />
    <span class="mt-3 block text-right text-xs font-bold text-white/80 group-hover:text-white">
      Ver detalle de mi nivel →
    </span>
  </a>

</section>
