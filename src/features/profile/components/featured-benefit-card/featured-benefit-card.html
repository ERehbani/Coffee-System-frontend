<article class="flex h-full flex-col rounded-2xl border border-border bg-surface p-3 shadow-sm">
  <div class="relative aspect-4/3 overflow-hidden rounded-2xl bg-accent-light">
    @if (benefit().imageUrl; as imageUrl) {
      <img [ngSrc]="imageUrl" fill alt="" class="object-cover" />
    } @else {
      <span
        aria-hidden="true"
        data-testid="benefit-placeholder"
        class="flex size-full items-center justify-center text-primary-dark"
      >
        <app-icon name="gift" [size]="40" />
      </span>
    }
    <span
      class="absolute top-2 right-2 rounded-full bg-white/90 px-2.5 py-1 text-xs font-bold text-primary-dark"
    >
      {{ benefit().pointsCost | number }} pts
    </span>
  </div>
  <h3 class="mt-3 truncate text-base font-bold text-text">{{ benefit().title }}</h3>
  <p class="truncate text-sm text-muted">{{ benefit().description }}</p>
  @if (!canRedeem()) {
    <p [id]="hintId()" class="mt-1 text-xs font-medium text-primary">
      Te faltan {{ missingPoints() | number }} pts
    </p>
  }
  <div class="mt-auto pt-3">
    <button
      type="button"
      [disabled]="!canRedeem()"
      [attr.aria-describedby]="canRedeem() ? null : hintId()"
      (click)="redeem.emit(benefit().id)"
      class="w-full rounded-xl bg-primary py-2.5 text-sm font-bold text-white transition-colors enabled:hover:bg-primary-dark focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary disabled:cursor-not-allowed disabled:bg-border disabled:text-muted"
    >
      Canjear<span class="sr-only"> {{ benefit().title }}</span>
    </button>
  </div>
</article>
