<ul aria-label="Acciones rápidas" class="flat-list">
  @for (action of actions; track action.id) {
    <li>
      <button type="button" (click)="actionSelected.emit(action.id)" class="list-row">
        <app-icon [name]="action.icon" [size]="18" class="text-primary" />
        <span class="flex-1">{{ action.label }}</span>
        <app-icon name="chevron-right" [size]="16" class="text-muted" />
      </button>
    </li>
  }
</ul>
