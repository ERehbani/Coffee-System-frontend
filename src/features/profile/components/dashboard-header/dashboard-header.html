<header class="flex items-center gap-3">
  @if (avatarUrl(); as url) {
    <img
      [ngSrc]="url"
      width="48"
      height="48"
      alt=""
      priority
      class="size-12 shrink-0 rounded-full object-cover"
    />
  } @else {
    <span
      aria-hidden="true"
      class="flex size-12 shrink-0 items-center justify-center rounded-full bg-accent-light text-lg font-bold text-primary-dark"
    >
      {{ initials() }}
    </span>
  }
  <h1 class="min-w-0 truncate text-xl leading-tight font-extrabold text-text">¡Hola, {{ firstName() }}!</h1>
</header>
