<article [attr.aria-labelledby]="titleId()" class="px-1 py-3">
  <div class="flex items-start justify-between gap-3">
    <div class="min-w-0">
      <p class="flex items-center gap-1.5 text-[11px] font-bold tracking-wider text-success uppercase">
        <span aria-hidden="true" class="size-1.5 rounded-full bg-success"></span>
        Listo para canje
      </p>
      <h3 [id]="titleId()" class="mt-1 text-sm leading-snug font-bold text-text">
        {{ redemption().title }}
      </h3>
      <p class="text-xs text-muted">{{ redemption().description }}</p>
    </div>
    <button
      type="button"
      aria-label="Ver código QR y detalle"
      (click)="showQr.emit(redemption().id)"
      class="icon-btn icon-btn-primary"
    >
      <app-icon name="qr-code" [size]="18" />
    </button>
  </div>

  <div class="mt-2 flex flex-wrap items-center gap-x-3 gap-y-1.5">
    <div class="inline-flex items-center gap-2 rounded-md border border-border bg-accent-light/50 py-1 pr-1 pl-2.5">
      <span class="sr-only">Código de canje: </span>
      <code class="font-mono text-sm font-bold tracking-[0.15em] text-text">{{ redemption().code }}</code>
      <button
        type="button"
        aria-label="Copiar código"
        (click)="copyCode()"
        class="icon-btn size-6 bg-transparent"
      >
        <app-icon [name]="copyState() === 'copied' ? 'check' : 'copy'" [size]="14" />
      </button>
    </div>
    @if (expiryLabel(); as label) {
      <p class="text-xs text-text">{{ label }}</p>
    }
    <p
      aria-live="polite"
      class="text-xs font-semibold"
      [class.text-success]="copyState() === 'copied'"
      [class.text-muted]="copyState() === 'failed'"
    >
      {{ copyMessage() }}
    </p>
  </div>
</article>
