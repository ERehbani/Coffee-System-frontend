<article
  [attr.aria-labelledby]="titleId()"
  class="rounded-2xl border border-border bg-surface p-4 shadow-sm"
>
  <div class="flex items-start justify-between gap-3">
    <div class="min-w-0">
      <p class="flex items-center gap-2 text-xs font-bold tracking-wide text-success uppercase">
        <span aria-hidden="true" class="size-2 rounded-full bg-success"></span>
        Listo para canje
      </p>
      <h3 [id]="titleId()" class="mt-1.5 text-lg leading-snug font-bold text-text">
        {{ redemption().title }}
      </h3>
      <p class="mt-0.5 text-sm text-muted">{{ redemption().description }}</p>
    </div>
    <button
      type="button"
      aria-label="Mostrar código QR"
      (click)="showQr.emit(redemption().id)"
      class="flex size-14 shrink-0 items-center justify-center rounded-2xl border border-border bg-accent-light text-primary-dark transition-colors hover:border-primary focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary"
    >
      <app-icon name="qr-code" [size]="28" />
    </button>
  </div>

  <hr class="my-4 border-t border-dashed border-border" />

  <div class="flex items-center gap-2 rounded-xl border border-border bg-accent-light px-3 py-2">
    <app-icon name="rectangle-ellipsis" [size]="18" class="text-muted" />
    <span class="sr-only">Código de canje: </span>
    <code class="font-mono text-base font-bold tracking-[0.15em] text-text">{{
      redemption().code
    }}</code>
    <button
      type="button"
      aria-label="Copiar código"
      (click)="copyCode()"
      class="rounded-md p-1 text-primary-dark transition-colors hover:bg-surface focus-visible:outline-2 focus-visible:outline-offset-1 focus-visible:outline-primary"
    >
      <app-icon [name]="copyState() === 'copied' ? 'check' : 'copy'" [size]="18" />
    </button>
  </div>

  <div class="mt-2 flex flex-wrap items-center justify-between gap-x-3 gap-y-1 text-sm">
    <p class="flex items-center gap-1.5 text-text">
      <app-icon name="clock" [size]="14" class="text-muted" />
      {{ expiryLabel() }}
    </p>
    <p
      aria-live="polite"
      class="text-xs font-semibold"
      [class.text-success]="copyState() === 'copied'"
      [class.text-muted]="copyState() === 'failed'"
    >
      {{ copyMessage() }}
    </p>
  </div>
</article>
