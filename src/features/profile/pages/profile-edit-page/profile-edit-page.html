<main class="space-y-5">
  <div class="page-header">
    <a routerLink="/profile" class="btn-secondary h-8 text-xs" aria-label="Volver al perfil">
      <span>Volver al perfil</span>
    </a>

    <div class="flex items-center gap-1 text-xs font-semibold text-muted">
      <span>Mi cuenta</span>
      <span>/</span>
      <span class="font-bold text-primary">Edición</span>
    </div>
  </div>

  @if (store.status() === 'loading' && !store.profile()) {
    <div aria-busy="true" class="space-y-4 motion-safe:animate-pulse">
      <div class="h-56 rounded-lg bg-border/60"></div>
      <div class="h-24 rounded-lg bg-border/60"></div>
    </div>
  } @else if (store.status() === 'error' && !store.profile()) {
    <div class="empty-state flat-panel">
      <h2 class="text-base font-bold text-text">No se pudieron cargar tus datos de perfil</h2>
      <p class="text-sm text-muted">Hubo un problema al consultar tu información.</p>
      <button type="button" (click)="onReload()" class="btn-primary mt-2">Reintentar</button>
    </div>
  } @else if (store.profile(); as profile) {
    <app-profile-edit-form
      [profile]="profile"
      [isSaving]="store.isSaving()"
      (save)="onSave($event)"
      (cancel)="onCancel()"
    />
  }
</main>
