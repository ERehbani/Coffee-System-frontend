<article class="flex items-center justify-between gap-3 px-1 py-3" [class.opacity-80]="showAccess() && !isUnlocked()">
  <div class="min-w-0 space-y-1.5">
    <h3 class="text-sm font-bold text-text">{{ benefit().name }}</h3>
    @if (benefit().soldOut) {
      <span class="badge badge-warning">Agotado</span>
    } @else if (showAccess()) {
      @if (isUnlocked()) {
        <span class="badge badge-success">Disponible</span>
      } @else {
        <span class="badge badge-neutral">Bloqueado</span>
      }
    }
  </div>

  <a
    [routerLink]="['/rewards', benefit().externalId]"
    [attr.aria-label]="'Ver más sobre ' + benefit().name"
    class="btn-secondary shrink-0"
  >
    Ver más
    <app-icon name="chevron-right" [size]="14" />
  </a>
</article>
